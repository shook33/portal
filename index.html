<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilities Directory App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f8fafc; padding: 32px; color: #0f172a; }
        :root { --ocean-blue: #0369a1; --slate-charcoal: #0f172a; --white: #ffffff; --border-gray: #cbd5e1; --muted-text: #64748b; }
        
        .card { background-color: var(--white); border: 1px solid var(--border-gray); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .warning-badge { background-color: #ffedd5; color: #ea580c; border: 1px solid #fed7aa; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        
        @keyframes borderPulse { 0% { border-color: var(--border-gray); } 50% { border-color: #f97316; box-shadow: 0 0 8px rgba(249, 115, 22, 0.2); } 100% { border-color: var(--border-gray); } }
        .overdue-warning-active { animation: borderPulse 2s infinite ease-in-out; border-width: 2px !important; }

        input[type="text"], input[type="date"], select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-gray); border-radius: 6px; font-size: 13px; color: var(--slate-charcoal); }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--ocean-blue); margin-bottom: 4px; }
        .btn { color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <!-- APP HEADER TITLE -->
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
        <span style="font-size: 22px;">📁</span>
        <h1 style="font-size: 24px; font-weight: 700; color: var(--ocean-blue); margin: 0;">Facilities Directory</h1>
    </div>
    <!-- UNIVERSAL CREATION CARD (FOR ADDING BLANK NEW RECORDS FROM SCRATCH) -->
    <div class="card" style="border-top: 4px solid var(--ocean-blue); margin-bottom: 32px;">
        <div style="font-weight: 700; font-size: 15px; color: var(--ocean-blue); margin-bottom: 16px; display: flex; align-items: center; gap: 6px;">
            <span>🏢</span> Quick-Add New Active Facility Profile
        </div>
        
        <!-- ROW 1: PRIMARY ASSET DATA IDENTIFIERS -->
        <div style="display: grid; grid-template-columns: 1.5fr 1.5fr 1.2fr 1.2fr; gap: 12px; margin-bottom: 12px;">
            <div>
                <label>Facility Name:</label>
                <input type="text" id="createName" placeholder="e.g. Bay Village">
            </div>
            <div>
                <label>Street Address:</label>
                <input type="text" id="createAddress" placeholder="Address, City, ZIP">
            </div>
            <div>
                <label>Primary Phone Number:</label>
                <input type="text" id="createPhone" placeholder="941-000-0000">
            </div>
            <div>
                <label>Active Operational Tier:</label>
                <select id="createTier">
                    <option value="1500">1 Series Subscription ($1,500)</option>
                    <option value="2300">2 Series Bundle Subscription ($2,300)</option>
                </select>
            </div>
        </div>

        <!-- ROW 2: CORE CONTACT METADATA TRACKERS -->
        <div style="display: grid; grid-template-columns: 1fr 1.2fr 1.2fr 1.5fr; gap: 12px; margin-bottom: 16px;">
            <div>
                <label>Series Subscribed Codes:</label>
                <input type="text" id="createCodes" placeholder="e.g. MM, GI1, GI2">
            </div>
            <div>
                <label>Primary Contact Name:</label>
                <input type="text" id="createRepName" placeholder="Rep Full Name">
            </div>
            <div>
                <label>Contact Position/Role:</label>
                <input type="text" id="createRepPosition" placeholder="e.g. Life Director" maxlength="75">
            </div>
            <div>
                <label>Contact Email Address:</label>
                <input type="text" id="createRepEmail" placeholder="email@facility.org">
            </div>
        </div>

        <!-- SUBMIT / COMMIT TRIGGER BUTTON -->
        <div style="display: flex; justify-content: flex-end;">
            <button type="button" class="btn" style="background-color: var(--ocean-blue); display: flex; align-items: center; gap: 6px;" onclick="createNewFacilityRecord()">
                💾 Save Facility Record
            </button>
        </div>
    </div>

    <!-- DYNAMICALLY BUILT TRACKING LIST CONTAINER WRAPPER -->
    <div id="dynamicDirectoryList"></div>
    </div>
    <!-- DIRECTORY CONTAINER END -->

    <!-- QUICK-ADD NOTES ENTRY BLOCK (Anchored at page bottom) -->
    <div class="card" style="border-top: 4px solid var(--slate-charcoal); margin-top: 32px;">
        <div style="font-weight: 700; font-size: 15px; color: var(--slate-charcoal); margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
            <span>📝</span> Quick-Add New Activity Log Entry
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <div style="display: grid; grid-template-columns: 1fr 250px; gap: 12px;">
                <input type="text" id="quickNoteContent" placeholder="Type historical log or call details here...">
                <div>
                    <select id="quickNoteFacilityTarget">
                        <option value="">-- Choose Target Facility --</option>
                    </select>
                </div>
            </div>
            
            <div style="display: flex; justify-content: flex-end;">
                <button type="button" class="btn" style="background-color: var(--slate-charcoal);" onclick="saveQuickNote()">
                    ⚡ Log Entry to Timeline
                </button>
            </div>
        </div>
    </div>
    <!-- DYNAMIC SYSTEM STORAGE ENGINE -->
    <script>
        // Initialize dynamic database state array structure
        let facilityDatabase = JSON.parse(localStorage.getItem('sill_facilities_db')) || [];
        let globalInteractionLogs = JSON.parse(localStorage.getItem('sill_global_logs')) || [];

        // Run render engine on initialization setup
        document.addEventListener("DOMContentLoaded", function() {
            renderDirectoryView();
        });

        // CREATE NEW BLANK INSTANCE INTERFACE MAPPER
        function createNewFacilityRecord() {
            const name = document.getElementById('createName').value.trim();
            if (!name) {
                alert('Please provide a Facility Name to initialize a workspace container.');
                return;
            }

            // Structure a completely fresh database data object item element
            const newFacility = {
                id: 'fac_' + Date.now(),
                name: name,
                address: document.getElementById('createAddress').value.trim(),
                phone: document.getElementById('createPhone').value.trim(),
                tier: document.getElementById('createTier').value,
                codes: document.getElementById('createCodes').value.trim(),
                repName: document.getElementById('createRepName').value.trim(),
                repPosition: document.getElementById('createRepPosition').value.trim(),
                repEmail: document.getElementById('createRepEmail').value.trim(),
                contractSent: "",
                contractReceived: "",
                paymentStatus: "Unpaid",
                amountPaid: "0",
                extraStaff: [],
                notes: []
            };

            facilityDatabase.push(newFacility);
            syncDatabaseToLocalStorage();
            renderDirectoryView();

            // Clear input fields completely back to standard baseline
            document.getElementById('createName').value = '';
            document.getElementById('createAddress').value = '';
            document.getElementById('createPhone').value = '';
            document.getElementById('createCodes').value = '';
            document.getElementById('createRepName').value = '';
            document.getElementById('createRepPosition').value = '';
            document.getElementById('createRepEmail').value = '';
        }

        // PERSISTENCE STORAGE CONTROLLER SYNCS
        function syncDatabaseToLocalStorage() {
            localStorage.setItem('sill_facilities_db', JSON.stringify(facilityDatabase));
            localStorage.setItem('sill_global_logs', JSON.stringify(globalInteractionLogs));
        }

        // ACCORDION DISPLAY TOGGLE STATE MECHANISM
        function toggleFacilityCard(cardElementId) {
            const card = document.getElementById(cardElementId);
            if (!card) return;
            const detailsPanel = card.querySelector('.details-expanded-panel');
            const isExpanded = card.getAttribute('data-expanded') === 'true';
            
            if (isExpanded) {
                card.setAttribute('data-expanded', 'false');
                detailsPanel.style.display = 'none';
            } else {
                card.setAttribute('data-expanded', 'true');
                detailsPanel.style.display = 'block';
            }
        }

        // UPDATE AN ACTIVE INSTANCE FIELD VALUE
        function updateFacilityField(facilityId, fieldKey, updatedValue) {
            const index = facilityDatabase.findIndex(f => f.id === facilityId);
            if (index !== -1) {
                facilityDatabase[index][fieldKey] = updatedValue;
                syncDatabaseToLocalStorage();
            }
        }
        // DYNAMIC RENDERING COMPONENT LAYOUT ARCHITECTURE LOOP
        function renderDirectoryView() {
            const container = document.getElementById('dynamicDirectoryList');
            const dropdownSelector = document.getElementById('quickNoteFacilityTarget');
            
            container.innerHTML = '';
            dropdownSelector.innerHTML = '<option value="">-- Choose Target Facility --</option>';

            if (facilityDatabase.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted-text); font-style:italic;">No active facility workspaces initiated. Use the configuration form above to add your facilities.</div>`;
                return;
            }

            facilityDatabase.forEach(facility => {
                const linkedNotes = globalInteractionLogs.filter(log => log.facilityId === facility.id);
                
                const opt = document.createElement('option');
                opt.value = facility.id;
                opt.innerText = `Target: ${facility.name}`;
                dropdownSelector.appendChild(opt);

                const cardHTML = `
                    <div class="card overdue-warning-active" data-expanded="false" id="${facility.id}" style="margin-bottom: 20px; overflow: hidden; padding: 0;">
                        <!-- COMPACT SUMMARY BAR -->
                        <div onclick="toggleFacilityCard('${facility.id}')" style="padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; background: #ffffff;">
                            <div>
                                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                                    <h2 style="font-size: 18px; font-weight: 700; color: var(--slate-charcoal); margin: 0;">${facility.name}</h2>
                                    <span class="warning-badge">⚠️ DUE UPON RECEIPT</span>
                                </div>
                                <div style="font-size: 13px; color: var(--muted-text); display: flex; flex-direction: column; gap: 4px;">
                                    <span>📍 ${facility.address || 'No Address Logged'} | 📞 ${facility.phone || 'No Phone Logged'}</span>
                                    <span style="color: var(--ocean-blue); font-weight: 600;">📋 Active Series Bundle: ${facility.codes ? facility.codes : 'None Specified'} (${facility.tier == '1500' ? '1 Series' : '2 Series'})</span>
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; justify-content: flex-end;">
                                    <span style="font-size: 13px; font-weight: 600; color: #475569; background: #e2e8f0; padding: 2px 8px; border-radius: 4px;">${facility.paymentStatus}</span>
                                    <button type="button" class="btn" style="background: #ef4444; padding: 4px 8px; font-size: 11px; border-radius: 4px;" onclick="event.stopPropagation(); deleteFacilityRecord('${facility.id}')">🗑️ Permanent Delete</button>
                                </div>
                                <div style="font-size: 20px; font-weight: 700; color: var(--slate-charcoal);">
                                    $${facility.amountPaid} <span style="font-size: 13px; font-weight: 400; color: var(--muted-text);">paid of $${facility.tier}</span>
                                </div>
                            </div>
                        </div>

                        <!-- EXPANDED DETAILED WORKSPACE GRID -->
                        <div class="details-expanded-panel" style="display: none; padding: 20px; border-top: 1px solid var(--border-gray); background: #fafafa;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 20px;">
                                <div style="background: #ffffff; border: 1px solid var(--border-gray); border-radius: 6px; padding: 16px;">
                                    <div style="font-weight: 700; font-size: 14px; color: var(--ocean-blue); margin-bottom: 12px;">📝 Contract Tracking Milestones</div>
                                    <div style="margin-bottom: 12px;">
                                        <label>Date Contract Dispatched Sent:</label>
                                        <input type="date" value="${facility.contractSent}" onchange="updateFacilityField('${facility.id}', 'contractSent', this.value)">
                                    </div>
                                    <div>
                                        <label>Date Signed Contract Received Back:</label>
                                        <input type="date" value="${facility.contractReceived}" onchange="updateFacilityField('${facility.id}', 'contractReceived', this.value)">
                                    </div>
                                </div>
                                <div style="background: #ffffff; border: 1px solid var(--border-gray); border-radius: 6px; padding: 16px;">
                                    <div style="font-weight: 700; font-size: 14px; color: var(--ocean-blue); margin-bottom: 12px;">📋 Core Profile Metadata Info</div>
                                    <div style="margin-bottom: 12px;">
                                        <label>📍 Street Address:</label>
                                        <input type="text" value="${facility.address}" onchange="updateFacilityField('${facility.id}', 'address', this.value)">
                                    </div>
                                    <div style="margin-bottom: 12px;">
                                        <label>📞 Phone:</label>
                                        <input type="text" value="${facility.phone}" onchange="updateFacilityField('${facility.id}', 'phone', this.value)">
                                    </div>
                                    <div>
                                        <label>🗂️ Content Series Codes:</label>
                                        <input type="text" value="${facility.codes}" onchange="updateFacilityField('${facility.id}', 'codes', this.value)">
                                    </div>
                                </div>
                            </div>
                            <div style="background: #ffffff; border: 1px solid var(--border-gray); border-radius: 6px; padding: 16px; margin-bottom: 16px;">
                                <div style="font-weight: 700; font-size: 14px; color: var(--ocean-blue); margin-bottom: 12px;">👥 Assigned Representatives</div>
                                <div style="display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr; gap: 8px;">
                                    <div><label>👤 Rep Name:</label><input type="text" value="${facility.repName}" onchange="updateFacilityField('${facility.id}', 'repName', this.value)"></div>
                                    <div><label>💼 Position:</label><input type="text" value="${facility.repPosition}" maxlength="75" onchange="updateFacilityField('${facility.id}', 'repPosition', this.value)"></div>
                                    <div><label>📩 Email:</label><input type="text" value="${facility.repEmail}" onchange="updateFacilityField('${facility.id}', 'repEmail', this.value)"></div>
                                    <div><label>📱 Cell:</label><input type="text" placeholder="Mobile Input Link" readonly style="background:#f1f5f9; color:#94a3b8;"></div>
                                </div>
                                <div id="extra-reps-box-${facility.id}">
                                    ${facility.extraStaff.map((staff, sIdx) => `
                                        <div style="display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr auto; gap: 8px; margin-top:8px; align-items:center;">
                                            <input type="text" value="${staff.name}" readonly style="background:#f8fafc;">
                                            <input type="text" value="${staff.pos}" readonly style="background:#f8fafc;">
                                            <input type="text" value="${staff.email}" readonly style="background:#f8fafc;">
                                            <input type="text" value="${staff.cell}" readonly style="background:#f8fafc;">
                                            <button class="btn" style="background:#ef4444; padding:4px 8px; font-size:11px;" onclick="removeExtraStaff('${facility.id}', ${sIdx})">🗑️</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div style="background-color: #f1f5f9; border: 1px solid var(--border-gray); border-radius: 6px; padding: 12px; margin-bottom: 16px;">
                                <div style="font-weight: 700; font-size: 13px; color: var(--ocean-blue); margin-bottom: 8px;">➕ Add Extra Staff Contact</div>
                                <div style="display: grid; grid-template-columns: 1.2fr 1.2fr 1fr 1fr auto; gap: 8px; align-items: flex-end;">
                                    <div><input type="text" id="addStaffName-${facility.id}" placeholder="Full Name"></div>
                                    <div><input type="text" id="addStaffPos-${facility.id}" placeholder="Position Title" maxlength="75"></div>
                                    <div><input type="email" id="addStaffEmail-${facility.id}" placeholder="Email"></div>
                                    <div><input type="text" id="addStaffCell-${facility.id}" placeholder="Cell"></div>
                                    <button type="button" class="btn" style="background-color: var(--ocean-blue); padding: 6px 14px;" onclick="addExtraStaffRow('${facility.id}')">Add</button>
                                </div>
                            </div>

                            <div style="background: #ffffff; border: 1px solid var(--border-gray); border-radius: 6px; padding: 16px;">
                                <div style="font-weight: 700; font-size: 14px; color: var(--ocean-blue); margin-bottom: 12px;">📢 Historical Facility Interaction Logs</div>
                                <div style="display:flex; flex-direction:column; gap:8px;">
                                    ${linkedNotes.map(n => `
                                        <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid var(--border-gray); border-radius: 6px; padding: 8px 12px; font-size:13px;">
                                            <span><strong style="color:#64748b;">🗓️ ${n.date}:</strong> ${n.content}</span>
                                        </div>
                                    `).join('')}
                                    ${linkedNotes.length === 0 ? '<span style="color:var(--muted-text); font-style:italic; font-size:13px;">No logged conversations. Use quick-adder tool below.</span>' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function addExtraStaffRow(facilityId) {
            const nameEl = document.getElementById(`addStaffName-${facilityId}`);
            if (!nameEl.value.trim()) { alert('Staff name is required.'); return; }
            
            const index = facilityDatabase.findIndex(f => f.id === facilityId);
            if (index !== -1) {
                facilityDatabase[index].extraStaff.push({
                    name: nameEl.value.trim(),
                    pos: document.getElementById(`addStaffPos-${facilityId}`).value.trim(),
                    email: document.getElementById(`addStaffEmail-${facilityId}`).value.trim(),
                    cell: document.getElementById(`addStaffCell-${facilityId}`).value.trim()
                });
                syncDatabaseToLocalStorage();
                renderDirectoryView();
            }
        }

        function removeExtraStaff(facilityId, staffIndex) {
            const index = facilityDatabase.findIndex(f => f.id === facilityId);
            if (index !== -1) {
                facilityDatabase[index].extraStaff.splice(staffIndex, 1);
                syncDatabaseToLocalStorage();
                renderDirectoryView();
            }
        }

        function saveQuickNote() {
            const content = document.getElementById('quickNoteContent').value.trim();
            const targetId = document.getElementById('quickNoteFacilityTarget').value;
            
            if (!content || !targetId) { alert('Please enter a note and pick a target facility.'); return; }
            
            globalInteractionLogs.unshift({
                date: new Date().toISOString().split('T')[0],
                facilityId: targetId,
                content: content
            });
            
            syncDatabaseToLocalStorage();
            renderDirectoryView();
            document.getElementById('quickNoteContent').value = '';
        }

        function deleteFacilityRecord(facilityId) {
            if (confirm("Are you sure you want to permanently delete this facility template instance?")) {
                facilityDatabase = facilityDatabase.filter(f => f.id !== facilityId);
                globalInteractionLogs = globalInteractionLogs.filter(log => log.facilityId !== facilityId);
                syncDatabaseToLocalStorage();
                renderDirectoryView();
            }
        }
    </script>
</body>
</html>
